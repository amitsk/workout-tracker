services:
  db:
    image: postgres:16-alpine
    container_name: workout-tracker-db
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout_tracker
    ports:
      - "5433:5432"
    volumes:
      - workout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout -d workout_tracker"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  workout_pgdata:
